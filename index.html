<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#eef0f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1218" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>PPL Lift Log</title>
<style>
/* Layout: one narrow training-log column (phone first), day tabs on top, exercise cards, a fixed rest-timer bar at the bottom. */
:root{
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#f5f6f8; --line:#d9dde4;
  --fg:#161a22; --muted:#5d6574; --accent:#2346d6; --accent-ink:#ffffff;
  --amrap:#c26a0a; --amrap-bg:#fdf0df; --done:#16804a; --done-bg:#e3f4ea; --danger:#b3261e;
  --display:"Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --body:-apple-system,system-ui,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --surface:#181c24; --surface-2:#1f242e; --line:#2c3340;
  --fg:#e9ecf2; --muted:#98a1b2; --accent:#6f8cff; --accent-ink:#0b0f1a;
  --amrap:#f0a24a; --amrap-bg:#33240f; --done:#4cc785; --done-bg:#12301f; --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218; --surface:#181c24; --surface-2:#1f242e; --line:#2c3340;
  --fg:#e9ecf2; --muted:#98a1b2; --accent:#6f8cff; --accent-ink:#0b0f1a;
  --amrap:#f0a24a; --amrap-bg:#33240f; --done:#4cc785; --done-bg:#12301f; --danger:#ff8a80; color-scheme:dark}

html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 150px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:2rem;font-weight:800;text-transform:uppercase;line-height:1}
.sub{color:var(--muted);font-size:.9rem;margin-top:4px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.label{font-family:var(--display);font-weight:700;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:7px;padding:10px 0;font-family:var(--display);font-weight:700;font-size:1.15rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.variant{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.hint{font-size:.85rem;color:var(--muted)}
.unit{margin-left:auto}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ss{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.ss>.ex{border:0;border-radius:0}
.ss>.ex+.ex{border-top:1px dashed var(--line)}
.ss-tag{font-family:var(--display);font-weight:700;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);padding:10px 14px 0}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.ex-head h3{font-size:1.3rem;font-weight:700}
.scheme{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.ex select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 8px;font-size:.9rem;max-width:100%}
.last{font-size:.82rem;color:var(--muted)}
.last b{font-family:var(--mono);font-weight:500;color:var(--fg)}

.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:2.2rem 1fr 1fr 2.8rem;gap:8px;align-items:center;padding:4px;border-radius:8px}
.set.done{background:var(--done-bg)}
.set.amrap .n{color:var(--amrap)}
.n{font-family:var(--mono);font-weight:700;font-size:.85rem;text-align:center;color:var(--muted)}
.set input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 8px;font-family:var(--mono);font-size:1rem;text-align:center;font-variant-numeric:tabular-nums}
.set input::placeholder{color:var(--muted);opacity:.7}
.tick{height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-size:1.1rem;font-weight:700;color:var(--muted)}
.set.done .tick{background:var(--done);border-color:var(--done);color:var(--surface)}
.colhead{display:grid;grid-template-columns:2.2rem 1fr 1fr 2.8rem;gap:8px;padding:0 4px}
.colhead span{text-align:center}
.amrap-note{font-size:.8rem;color:var(--amrap);background:var(--amrap-bg);border-radius:6px;padding:4px 8px;align-self:flex-start}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 18px;font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase}
.btn.primary{background:var(--accent);color:var(--accent-ink);flex:1}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn.danger{background:var(--danger);color:var(--surface)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.status{font-size:.88rem;color:var(--done);min-height:1.2em}

.hist{display:flex;flex-direction:column;gap:8px}
.hrow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.hrow .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hrow .day{font-family:var(--display);font-weight:700;font-size:1.1rem;text-transform:uppercase}
.hrow .date{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.hrow .lifts{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hrow .lifts b{color:var(--fg);font-weight:600}
.hrow .del{border:0;background:none;color:var(--muted);font-size:.8rem;padding:2px 4px;text-decoration:underline}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:16px;color:var(--muted);font-size:.9rem}

/* Rest timer bar */
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.timer-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:10px}
.clock{font-family:var(--mono);font-weight:700;font-size:2.1rem;font-variant-numeric:tabular-nums;line-height:1;min-width:5.2ch}
.timer.running .clock{color:var(--accent)}
.timer.over .clock{color:var(--done)}
.tlabel{font-size:.82rem;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtns{display:flex;gap:6px;flex-wrap:wrap}
.tbtns button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 10px;font-family:var(--mono);font-size:.85rem}
.tbtns .go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bar{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
.elapsed{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div>
      <h1>PPL Lift Log</h1>
      <div class="sub" id="sessionLine">Session not started</div>
    </div>
    <div class="elapsed" id="elapsed"></div>
  </header>

  <div class="seg" role="group" aria-label="Training day">
    <button id="d-pull" data-day="pull" aria-pressed="true">Pull</button>
    <button id="d-push" data-day="push" aria-pressed="false">Push</button>
    <button id="d-legs" data-day="legs" aria-pressed="false">Legs</button>
  </div>

  <div class="variant" id="variantRow"></div>

  <main id="workout" class="wrap" style="padding:0;gap:14px"></main>

  <div class="actions" id="actions">
    <button class="btn primary" id="finishBtn">Finish &amp; save workout</button>
    <button class="btn ghost" id="resetBtn">Clear</button>
  </div>
  <div class="status" id="status" role="status"></div>

  <section style="display:flex;flex-direction:column;gap:10px">
    <div class="label">History</div>
    <div class="actions">
      <button class="btn ghost" id="exportBtn">Export backup</button>
      <label class="btn ghost" for="importFile" style="cursor:pointer">Import backup</label>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <div class="hist" id="history"><div class="empty">Loading your log…</div></div>
  </section>
</div>

<div class="timer" id="timer">
  <div class="timer-in">
    <div class="trow">
      <div class="clock" id="clock">0:00</div>
      <div class="tlabel" id="tlabel">Rest timer · tick a set to start</div>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="tbtns">
      <button id="t60">1:00</button><button id="t90">1:30</button><button id="t120">2:00</button><button id="t180">3:00</button>
      <button id="tminus">−15s</button><button id="tplus">+15s</button><button id="tstop">Stop</button>
    </div>
  </div>
</div>

<script>
/* ---------- Program ---------- */
const S = (n, reps, amrapLast) => Array.from({length:n}, (_, i) => ({reps, amrap: !!amrapLast && i === n-1}));
const main5 = (n) => [...S(n,"5"), {reps:"5+", amrap:true}];
const PROGRAM = {
  pull: { label:"Pull", variants:{
      A:{name:"Deadlift", note:"Deadlift day"}, B:{name:"Barbell row", note:"Row day"} },
    build(v){ return [
      v==="A" ? {id:"deadlift", name:"Deadlift", sets:[{reps:"5+",amrap:true}], rest:180, scheme:"1×5+"}
              : {id:"bbrow", name:"Barbell row", sets:main5(4), rest:180, scheme:"4×5, 1×5+"},
      {id:"vpull", name:"Vertical pull", alts:["Lat pulldown","Pull-up","Chin-up"], sets:S(3,"8–12"), rest:120, scheme:"3×8–12"},
      {id:"hrow", name:"Horizontal row", alts:["Seated cable row","Chest-supported row"], sets:S(3,"8–12"), rest:120, scheme:"3×8–12"},
      {id:"facepull", name:"Face pull", sets:S(5,"15–20"), rest:60, scheme:"5×15–20"},
      {id:"hammer", name:"Hammer curl", sets:S(4,"8–12"), rest:75, scheme:"4×8–12"},
      {id:"dbcurl", name:"Dumbbell curl", sets:S(4,"8–12"), rest:75, scheme:"4×8–12"},
    ];}},
  push: { label:"Push", variants:{
      A:{name:"Bench press", note:"Bench heavy, OHP volume"}, B:{name:"Overhead press", note:"OHP heavy, bench volume"} },
    build(v){ const heavyBench = v==="A"; return [
      heavyBench ? {id:"bench5", name:"Bench press", sets:main5(4), rest:180, scheme:"4×5, 1×5+"}
                 : {id:"ohp5", name:"Overhead press", sets:main5(4), rest:180, scheme:"4×5, 1×5+"},
      heavyBench ? {id:"ohp812", name:"Overhead press", sets:S(3,"8–12"), rest:120, scheme:"3×8–12"}
                 : {id:"bench812", name:"Bench press", sets:S(3,"8–12"), rest:120, scheme:"3×8–12"},
      {id:"incdb", name:"Incline dumbbell press", sets:S(3,"8–12"), rest:105, scheme:"3×8–12"},
      {id:"pushdown", name:"Triceps pushdown", sets:S(3,"8–12"), rest:0, scheme:"3×8–12", ss:"ss1"},
      {id:"lateral1", name:"Lateral raise", sets:S(3,"15–20"), rest:75, scheme:"3×15–20", ss:"ss1"},
      {id:"ohtri", name:"Overhead triceps extension", sets:S(3,"8–12"), rest:0, scheme:"3×8–12", ss:"ss2"},
      {id:"lateral2", name:"Lateral raise", sets:S(3,"15–20"), rest:75, scheme:"3×15–20", ss:"ss2"},
    ];}},
  legs: { label:"Legs", variants:null,
    build(){ return [
      {id:"squat", name:"Squat", sets:[...S(2,"5"),{reps:"5+",amrap:true}], rest:180, scheme:"2×5, 1×5+"},
      {id:"rdl", name:"Romanian deadlift", sets:S(3,"8–12"), rest:120, scheme:"3×8–12"},
      {id:"legpress", name:"Leg press", sets:S(3,"8–12"), rest:120, scheme:"3×8–12"},
      {id:"legcurl", name:"Leg curl", sets:S(3,"8–12"), rest:90, scheme:"3×8–12"},
      {id:"calf", name:"Calf raise", sets:S(5,"8–12"), rest:60, scheme:"5×8–12"},
    ];}},
};

/* ---------- Storage (account db, falls back to this browser) ---------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};
let col = null;            // db collection for this viewer
let history = [];          // saved sessions, newest first
let storeMode = "local";

async function initStore(){ await loadHistory(); }
async function loadHistory(){
  if (col){
    try{
      const snap = await col.orderBy("date","desc").limit(60).get();
      history = snap.docs.map(d => ({id:d.id, ...d.data()}));
    }catch(e){ history = LS.get("ppl.history", []); storeMode = "local"; col = null; }
  } else history = LS.get("ppl.history", []);
  const untouched = !Object.values(state.sets).some(v => v.w || v.r || v.done);
  if (untouched && PROGRAM[state.day].variants) state.variant = suggestedVariant(state.day);
  renderHistory(); renderVariant(); renderWorkout();
}
async function saveSession(s){
  if (col){ await col.doc(s.id).set(s); }
  else { const h = LS.get("ppl.history", []); h.unshift(s); LS.set("ppl.history", h); }
  history.unshift(s);
}
async function deleteSession(id){
  if (col){ await col.doc(id).delete(); }
  else LS.set("ppl.history", LS.get("ppl.history", []).filter(s => s.id !== id));
  history = history.filter(s => s.id !== id);
}

/* ---------- Current workout state (draft kept in this browser) ---------- */
let state = LS.get("ppl.draft", null) || freshState("pull", null);
let unit = LS.get("ppl.unit", "lb");
function freshState(day, variant){
  return {day, variant, choices:{}, sets:{}, started:null};
}
function suggestedVariant(day){
  if (!PROGRAM[day].variants) return null;
  const last = history.find(s => s.day === day);
  return last ? (last.variant === "A" ? "B" : "A") : "A";
}
function saveDraft(){ LS.set("ppl.draft", state); }
function key(exId, i){ return exId + ":" + i; }
function lastFor(exId){
  for (const s of history){
    const e = (s.exercises || []).find(x => x.id === exId);
    if (e && e.sets.some(x => x.w || x.r)) return e;
  }
  return null;
}

/* ---------- Render ---------- */
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderTabs(){
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.day === state.day));
}
function renderVariant(){
  const p = PROGRAM[state.day], row = $("variantRow");
  if (!state.variant && p.variants) state.variant = suggestedVariant(state.day);
  if (!p.variants){
    row.innerHTML = `<span class="hint">Same lifts every legs day.</span>${unitHtml()}`;
  } else {
    const sug = suggestedVariant(state.day);
    row.innerHTML = Object.entries(p.variants).map(([k,v]) =>
      `<button class="chip" id="v-${k}" data-v="${k}" aria-pressed="${state.variant===k}">${esc(v.name)} day</button>`).join("")
      + `<span class="hint">${history.some(s=>s.day===state.day) ? `Up next: ${esc(p.variants[sug].name.toLowerCase())}` : "Alternates each session"}</span>`
      + unitHtml();
    row.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { state.variant = b.dataset.v; saveDraft(); renderVariant(); renderWorkout(); });
  }
  const u = $("unitSel"); if (u) u.onchange = () => { unit = u.value; LS.set("ppl.unit", unit); renderWorkout(); };
}
function unitHtml(){
  return `<select class="chip unit" id="unitSel" aria-label="Weight unit"><option ${unit==="lb"?"selected":""}>lb</option><option ${unit==="kg"?"selected":""}>kg</option></select>`;
}

function exerciseHtml(ex){
  const choice = state.choices[ex.id] || (ex.alts ? ex.alts[0] : ex.name);
  const last = lastFor(ex.id);
  const lastTxt = last ? last.sets.filter(s=>s.w||s.r).map(s => `${s.w||"–"}×${s.r||"–"}`).join(" · ") : "";
  const hasAmrap = ex.sets.some(s => s.amrap);
  const rows = ex.sets.map((s, i) => {
    const v = state.sets[key(ex.id,i)] || {};
    const pw = last && last.sets[i] && last.sets[i].w ? last.sets[i].w : unit;
    return `<div class="set ${v.done?"done":""} ${s.amrap?"amrap":""}">
      <span class="n">${s.amrap ? "+" : i+1}</span>
      <input id="w-${ex.id}-${i}" inputmode="decimal" aria-label="${esc(choice)} set ${i+1} weight" placeholder="${esc(pw)}" value="${esc(v.w||"")}" data-k="${key(ex.id,i)}" data-f="w">
      <input id="r-${ex.id}-${i}" inputmode="numeric" aria-label="${esc(choice)} set ${i+1} reps" placeholder="${esc(s.reps)}" value="${esc(v.r||"")}" data-k="${key(ex.id,i)}" data-f="r">
      <button class="tick" id="t-${ex.id}-${i}" data-k="${key(ex.id,i)}" data-rest="${ex.rest}" data-name="${esc(choice)}" aria-label="Mark set done" aria-pressed="${!!v.done}">✓</button>
    </div>`;}).join("");
  return `<div class="ex">
    <div class="ex-head"><h3>${esc(ex.alts ? choice : ex.name)}</h3><span class="scheme">${ex.scheme}</span></div>
    ${ex.alts ? `<select id="alt-${ex.id}" data-alt="${ex.id}" aria-label="Exercise choice">${ex.alts.map(a=>`<option ${a===choice?"selected":""}>${esc(a)}</option>`).join("")}</select>` : ""}
    ${lastTxt ? `<div class="last">Last time: <b>${esc(lastTxt)}</b></div>` : ""}
    ${hasAmrap ? `<div class="amrap-note">Last set “+”: as many good reps as you can</div>` : ""}
    <div class="colhead label"><span>Set</span><span>${unit}</span><span>Reps</span><span></span></div>
    <div class="sets">${rows}</div>
  </div>`;
}
function renderWorkout(){
  renderTabs();
  const list = PROGRAM[state.day].build(state.variant);
  let html = "", i = 0;
  while (i < list.length){
    const ex = list[i];
    if (ex.ss && list[i+1] && list[i+1].ss === ex.ss){
      html += `<div class="ss"><div class="ss-tag">Superset · alternate sets, rest after the raise</div>${exerciseHtml(ex)}${exerciseHtml(list[i+1])}</div>`;
      i += 2;
    } else { html += exerciseHtml(ex); i++; }
  }
  $("workout").innerHTML = html;
  const v = PROGRAM[state.day].variants;
  $("sessionLine").textContent = state.started
    ? `${PROGRAM[state.day].label}${v ? " · " + v[state.variant].note : ""} · started ${new Date(state.started).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}`
    : `${PROGRAM[state.day].label}${v ? " · " + v[state.variant].note : ""} · log a set to start`;
}

$("workout").addEventListener("input", (e) => {
  const t = e.target; if (!t.dataset.k) return;
  const v = state.sets[t.dataset.k] || (state.sets[t.dataset.k] = {});
  v[t.dataset.f] = t.value.trim();
  if (!state.started) state.started = Date.now();
  saveDraft();
});
$("workout").addEventListener("change", (e) => {
  const t = e.target; if (!t.dataset.alt) return;
  state.choices[t.dataset.alt] = t.value; saveDraft(); renderWorkout();
});
$("workout").addEventListener("click", (e) => {
  const b = e.target.closest(".tick"); if (!b) return;
  const k = b.dataset.k, v = state.sets[k] || (state.sets[k] = {});
  v.done = !v.done;
  // Fill blanks from placeholders when ticking, so "same as last time" is one tap
  if (v.done){
    const row = b.parentElement, [wi, ri] = row.querySelectorAll("input");
    if (!v.w && wi.placeholder !== unit){ v.w = wi.placeholder; wi.value = v.w; }
    if (!v.r && !/[–+]/.test(ri.placeholder)){ v.r = ri.placeholder; ri.value = v.r; }
    if (!state.started) state.started = Date.now();
  }
  row_toggle(b, v.done);
  saveDraft();
  const rest = +b.dataset.rest;
  if (v.done && rest > 0) startTimer(rest, `Rest after ${b.dataset.name}`);
  else if (v.done && rest === 0) setLabel(`Go straight to the next superset move`);
});
function row_toggle(b, on){ b.parentElement.classList.toggle("done", on); b.setAttribute("aria-pressed", on); }

document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
  if (b.dataset.day === state.day) return;
  const hasWork = Object.values(state.sets).some(v => v.w || v.r || v.done);
  if (hasWork){ showStatus("Finish or clear this workout before switching days."); return; }
  state = freshState(b.dataset.day, null); saveDraft(); renderVariant(); renderWorkout();
});

/* Finish / clear with in-page confirmation */
function showStatus(t, ok){ const s = $("status"); s.textContent = t; s.style.color = ok ? "var(--done)" : "var(--muted)"; }
$("finishBtn").onclick = async () => {
  const list = PROGRAM[state.day].build(state.variant);
  const exercises = list.map(ex => ({
    id: ex.id, name: ex.alts ? (state.choices[ex.id] || ex.alts[0]) : ex.name,
    sets: ex.sets.map((s,i) => { const v = state.sets[key(ex.id,i)] || {}; return {w:v.w||"", r:v.r||"", amrap:s.amrap, done:!!v.done}; })
  }));
  if (!exercises.some(e => e.sets.some(s => s.w || s.r))){ showStatus("Log at least one set before saving."); return; }
  const now = Date.now();
  const s = { id: "s" + now, date: new Date(now).toISOString(), day: state.day, variant: state.variant || null, unit,
    minutes: state.started ? Math.round((now - state.started)/60000) : null, exercises };
  try{
    $("finishBtn").disabled = true;
    await saveSession(s);
    const next = state.day === "pull" ? "push" : state.day === "push" ? "legs" : "pull";
    state = freshState(next, null); saveDraft(); stopTimer();
    renderHistory(); renderVariant(); renderWorkout();
    showStatus(`Saved. Next up: ${PROGRAM[next].label}.`, true);
    window.scrollTo({top:0, behavior:"smooth"});
  }catch(e){ showStatus("Couldn't save. Check your connection and tap Finish again."); }
  finally{ $("finishBtn").disabled = false; }
};
$("resetBtn").onclick = () => {
  const a = $("actions");
  if (a.querySelector(".confirm")) return;
  const c = document.createElement("div"); c.className = "confirm";
  c.innerHTML = `<span>Clear all sets in this workout?</span><button class="btn danger" id="yesClear">Clear</button><button class="btn ghost" id="noClear">Keep</button>`;
  a.appendChild(c);
  $("yesClear").onclick = () => { state = freshState(state.day, state.variant); saveDraft(); renderWorkout(); c.remove(); showStatus("Cleared."); };
  $("noClear").onclick = () => c.remove();
};

/* History */
function fmtDate(iso){ const d = new Date(iso); return d.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"}); }
function renderHistory(){
  const h = $("history");
  const note = "Saved on this phone. Export a backup now and then.";
  if (!history.length){ h.innerHTML = `<div class="empty">No workouts yet. Log your sets above and tap <b>Finish &amp; save</b>; each session lands here with your top sets. ${note}</div>`; return; }
  h.innerHTML = history.slice(0, 30).map(s => {
    const p = PROGRAM[s.day]; const v = p && p.variants && s.variant ? " · " + p.variants[s.variant].name : "";
    const lifts = (s.exercises||[]).slice(0,3).map(e => {
      const best = e.sets.filter(x=>x.w||x.r).sort((a,b)=>(+b.w||0)-(+a.w||0))[0];
      return best ? `${esc(e.name)} <b>${esc(best.w||"–")}×${esc(best.r||"–")}</b>` : "";
    }).filter(Boolean).join(" · ");
    return `<div class="hrow" data-id="${esc(s.id)}">
      <div class="top"><span class="day">${p ? p.label : esc(s.day)}${esc(v)}</span><span class="date">${fmtDate(s.date)}${s.minutes ? " · " + s.minutes + " min" : ""}</span></div>
      <div class="lifts">${lifts || "No weights logged"}</div>
      <div><button class="del" data-del="${esc(s.id)}">Delete</button></div>
    </div>`;}).join("") + `<div class="hint">${note}</div>`;
}
$("history").addEventListener("click", async (e) => {
  const d = e.target.closest("[data-del]"); if (!d) return;
  if (d.dataset.armed){ try{ await deleteSession(d.dataset.del); renderHistory(); renderVariant(); }catch(err){ showStatus("Couldn't delete that session. Try again."); } }
  else { d.dataset.armed = "1"; d.textContent = "Tap again to delete"; setTimeout(() => { if (d.isConnected){ delete d.dataset.armed; d.textContent = "Delete"; } }, 3000); }
});

/* ---------- Rest timer ---------- */
let tEnd = 0, tTotal = 0, tTick = null, beeped = false, audio = null, wake = null;
function setLabel(t){ $("tlabel").textContent = t; }
function fmt(s){ const neg = s < 0; s = Math.abs(Math.round(s)); return (neg?"+":"") + Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
function startTimer(sec, label){
  ensureAudio();
  tTotal = sec; tEnd = Date.now() + sec*1000; beeped = false;
  setLabel(label || "Resting");
  $("timer").classList.add("running"); $("timer").classList.remove("over");
  clearInterval(tTick); tTick = setInterval(tick, 250); tick();
  try{ if (navigator.wakeLock && !wake) navigator.wakeLock.request("screen").then(w => { wake = w; w.addEventListener("release", () => wake = null); }).catch(()=>{}); }catch(e){}
}
function stopTimer(){
  clearInterval(tTick); tTick = null; tEnd = 0;
  $("clock").textContent = "0:00"; $("barFill").style.width = "0";
  $("timer").classList.remove("running","over"); setLabel("Rest timer · tick a set to start");
}
function tick(){
  const left = (tEnd - Date.now())/1000;
  $("clock").textContent = fmt(Math.max(left, -599));
  $("barFill").style.width = Math.min(100, Math.max(0, (1 - left/tTotal)*100)) + "%";
  if (left <= 0 && !beeped){
    beeped = true; $("timer").classList.remove("running"); $("timer").classList.add("over");
    setLabel("Rest's up. Next set."); beep();
    try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
  }
}
function ensureAudio(){ try{ if (!audio) audio = new (window.AudioContext||window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); }catch(e){} }
function beep(){
  if (!audio) return;
  [0, .25, .5].forEach((t, i) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = i === 2 ? 1320 : 880; o.connect(g); g.connect(audio.destination);
    const s = audio.currentTime + t; g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(.3, s+.02); g.gain.exponentialRampToValueAtTime(.0001, s+.18);
    o.start(s); o.stop(s+.2);
  });
}
[["t60",60],["t90",90],["t120",120],["t180",180]].forEach(([id,s]) => $(id).onclick = () => startTimer(s, `Rest · ${fmt(s)}`));
$("tplus").onclick = () => { if (tEnd){ tEnd += 15000; tTotal += 15; beeped = false; $("timer").classList.add("running"); $("timer").classList.remove("over"); tick(); } };
$("tminus").onclick = () => { if (tEnd){ tEnd -= 15000; tTotal = Math.max(15, tTotal-15); tick(); } };
$("tstop").onclick = stopTimer;

/* Backup */
$("exportBtn").onclick = async () => {
  const data = JSON.stringify({app:"ppl-lift-log", v:1, history:LS.get("ppl.history", [])}, null, 1);
  const name = "ppl-backup-" + new Date().toISOString().slice(0,10) + ".json";
  const file = new File([data], name, {type:"application/json"});
  try{
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return; }
  }catch(e){ if (e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
};
$("importFile").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try{
    const d = JSON.parse(await f.text());
    const incoming = Array.isArray(d) ? d : d.history;
    if (!Array.isArray(incoming)) throw 0;
    const have = new Set(history.map(s => s.id));
    const merged = [...history, ...incoming.filter(s => s && s.id && !have.has(s.id))].sort((a,b) => b.date < a.date ? -1 : 1);
    LS.set("ppl.history", merged); history = merged;
    renderHistory(); renderVariant(); renderWorkout();
    showStatus(`Imported ${merged.length} workouts.`, true);
  }catch(err){ showStatus("That file isn't a PPL Lift Log backup."); }
  e.target.value = "";
};

/* Offline support */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});

/* Session clock */
setInterval(() => { $("elapsed").textContent = state.started ? "⏱ " + fmt((Date.now()-state.started)/1000) : ""; }, 1000);

renderVariant(); renderWorkout(); initStore();
</script>

</body>
